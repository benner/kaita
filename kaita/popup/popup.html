<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kaita</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        width: 280px;
        font: 13px system-ui, sans-serif;
        color: #1c1b22;
        background: #fff;
      }

      #url {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
        margin-bottom: 4px;
      }

      #state,
      #count {
        color: #5b5b66;
      }

      #state[data-recording="true"] {
        color: #c50042;
        font-weight: 600;
      }

      #error {
        margin-top: 8px;
        padding: 6px 8px;
        border-radius: 4px;
        background: #ffe8e8;
        color: #8b0000;
      }

      .actions {
        display: grid;
        gap: 6px;
        margin-top: 12px;
      }

      button {
        padding: 6px 10px;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="url"></div>
    <div id="state"></div>
    <div id="count"></div>
    <div id="error" hidden></div>
    <div class="actions">
      <button id="record">Record changes</button>
      <button id="view">View changes</button>
      <button id="clear">Clear collected history</button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
